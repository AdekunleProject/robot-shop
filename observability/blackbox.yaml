# Blackbox exporter: sends real HTTP requests to Robot Shop and reports
# whether they succeeded, the status code and how long they took.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels:
    app: blackbox-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blackbox-exporter
  template:
    metadata:
      labels:
        app: blackbox-exporter
    spec:
      containers:
        - name: blackbox-exporter
          image: quay.io/prometheus/blackbox-exporter:v0.25.0
          ports:
            - name: http
              containerPort: 9115
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels:
    app: blackbox-exporter
spec:
  selector:
    app: blackbox-exporter
  ports:
    - name: http
      port: 9115
      targetPort: http
---
# Tells Prometheus which Robot Shop URLs to probe, every 15 seconds.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: robot-shop-http
  namespace: monitoring
spec:
  jobName: robot-shop-blackbox
  interval: 15s
  scrapeTimeout: 10s
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      static:
        - http://web.robot-shop:8080/
        - http://web.robot-shop:8080/api/catalogue/categories
        - http://web.robot-shop:8080/api/catalogue/products
        - http://web.robot-shop:8080/api/cart/health
        - http://web.robot-shop:8080/api/user/health
        - http://web.robot-shop:8080/api/payment/health
